name: Railway Nova image

on:
  pull_request:
    branches: [main-BrickBuilderAI]
  push:
    branches: [main-BrickBuilderAI]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Check Railway recipe
        run: python3 -m unittest discover -s tests
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Railway.Dockerfile
          platforms: linux/amd64
          load: true
          tags: nova-railway:check
          build-args: NOVA_WEB_REVISION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Check runtime metadata and private gateway
        run: >-
          docker run --rm --entrypoint python3
          -v "$PWD/tests/railway_runtime_smoke.py:/tmp/runtime-smoke.py:ro"
          -e NOVA_SERVICE_TOKEN=smoke-local-only
          -e EXPECTED_WEB_REVISION=${{ github.sha }}
          nova-railway:check /tmp/runtime-smoke.py
      - name: Check preview quality and deferred validation
        run: >-
          docker run --rm --entrypoint sh
          -v "$PWD/web/backend/tests:/app/web/backend/tests:ro"
          -v "$PWD/web/backend/requirements-dev.txt:/tmp/requirements-dev.txt:ro"
          nova-railway:check -c
          'pip install --quiet --break-system-packages -r /tmp/requirements-dev.txt &&
          cd /app/web/backend && python3 -m pytest
          tests/test_build_modes.py tests/test_builder_settings.py tests/test_parts_policy.py -q'
